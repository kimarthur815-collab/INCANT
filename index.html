*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#f3eefc;font-family:'Galmuri11',monospace;}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;}
#wrap{position:relative;width:min(100vw,calc(100vh*419/194));width:min(100vw,calc(100dvh*419/194));aspect-ratio:419/194;container-type:size;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;}
@media (orientation:portrait){body{align-items:flex-start}#wrap{width:100vw;aspect-ratio:419/300;}}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;}
#tf{position:absolute;inset:0;margin:0;z-index:5;}
#typer{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;background:transparent;color:transparent;caret-color:transparent;}
.layer{position:absolute;inset:0;z-index:10;display:none;}
.layer.on{display:flex;}
.btn{font-family:'Galmuri11',monospace;font-size:clamp(12px,2.6cqw,24px);color:#fff4d6;background:#2a2350;border:2px solid #d9b46a;padding:.45em 1.2em;cursor:pointer;min-width:9em;}
.btn:hover,.btn:focus-visible{background:#3d3270;outline:none;}
#lobby{flex-direction:column;align-items:center;justify-content:center;gap:1.6cqh;}
#title{font-family:'Galmuri11B',monospace;font-size:clamp(34px,13cqw,150px);color:#ffe08a;letter-spacing:.06em;margin:0 0 3cqh;text-shadow:.06em .06em 0 #2a1650,-.03em -.03em 0 #2a1650,.03em -.03em 0 #2a1650,-.03em .03em 0 #2a1650;}
#gear{position:absolute;right:2cqw;top:2.5cqh;min-width:0;padding:.25em .5em;font-size:clamp(12px,2.2cqw,20px);}
.panel{position:absolute;inset:4cqh 4cqw;background:#1b1533f2;border:2px solid #d9b46a;overflow:auto;padding:clamp(10px,2.4cqw,28px);font-size:clamp(12px,1.9cqw,19px);line-height:1.7;flex-direction:column;}
.panel h2{font-family:'Galmuri11B',monospace;font-size:1.35em;color:#ffe08a;margin:0 0 .6em;font-weight:normal;}
.panel h3{font-family:'Galmuri11B',monospace;font-size:1.05em;color:#c9b8ff;margin:1em 0 .3em;font-weight:normal;}
.panel p,.panel li{margin:.25em 0;}
.panel ul{padding-left:1.2em;margin:.2em 0;}
.panel .ex{color:#ffcf7a;}
.panel .close{align-self:flex-start;margin-top:1em;}
.row{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.15em 0;border-bottom:1px solid #3a2f63;}
.row input{font-family:'Galmuri11',monospace;font-size:16px;width:6em;background:#0f0c20;color:#fff4d6;border:1px solid #6a5a9a;padding:.15em .3em;}
.btns{display:flex;gap:.8em;flex-wrap:wrap;margin-top:1em;}
#exit{position:absolute;left:50%;top:.6cqh;transform:translateX(-50%);z-index:11;display:none;min-width:0;padding:.05em .6em;border-width:1px;font-size:clamp(9px,1.4cqw,14px);}
#result{flex-direction:column;align-items:center;justify-content:center;gap:2cqh;background:#0d0b1aa8;}
#rtitle{font-family:'Galmuri11B',monospace;font-size:clamp(30px,10cqw,110px);margin:0;}
#rsub{font-size:clamp(12px,2.2cqw,20px);color:#e6dcff;margin:0 0 1cqh;}
</style>

const LW=419,TOP=18,FIELD_H=140,FIELD_BOT=TOP+FIELD_H,FLOOR=TOP+127,LANE=FLOOR-40;
let LH=194;
const BK={x:0,y:0,w:0,h:0},PL={x:0,w:0},PR={x:0,w:0},TX={fs:7,small:5.5,lh:8,top:0,label:0,stat:0,lines:3};
function layout(cssW){
  if(LH>250){BK.x=6;BK.w=LW-12;BK.y=FIELD_BOT+4;BK.h=LH-BK.y-4;}
  else{BK.w=270;BK.x=Math.round((LW-BK.w)/2);BK.h=Math.max(60,LH-FIELD_BOT+34);BK.y=LH-BK.h;}
  const W1=Math.round((BK.w-80)/2),H1=BK.h-38;
  PL.x=BK.x+15;PL.w=W1+11;PR.x=BK.x+W1+46;PR.w=BK.x+BK.w-17-PR.x;
  TX.fs=Math.min(13,Math.max(7,11/(cssW/LW)));TX.small=TX.fs*0.78;TX.lh=TX.fs*1.18;
  TX.label=BK.y+4+TX.small;TX.top=TX.label+TX.fs*1.3;TX.stat=BK.y+14+H1+3;
  TX.lines=Math.max(1,Math.floor((TX.stat-TX.small-1-TX.top)/TX.lh)+1);
}
function drawBook(b){
  const img=IMG.book,sx=[0,20,50,90,120,140],sy=[0,14,52,76],W1=Math.round((b.w-80)/2);
  const dx=[0,20,20+W1,60+W1,60+2*W1,80+2*W1].map(v=>b.x+v),dy=[0,14,b.h-24,b.h].map(v=>b.y+v);
  for(let r=0;r<3;r++)for(let c=0;c<5;c++)ctx.drawImage(img,sx[c],sy[r],sx[c+1]-sx[c],sy[r+1]-sy[r],dx[c],dy[r],dx[c+1]-dx[c],dy[r+1]-dy[r]);
}

const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const SPLIT={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ','ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
function jamo(str){let o='';for(const ch of str){const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const i=c-0xAC00,b=JUNG[Math.floor((i%588)/28)],d=JONG[i%28];o+=CHO[Math.floor(i/588)]+(SPLIT[b]||b)+(d?(SPLIT[d]||d):'');}else o+=SPLIT[ch]||ch;}return o;}
const ALL_PREFIXES=['갓','킹','메가','슈퍼','로열','오메가','하이퍼','디럭스','럭셔리','앰퍼러','울트라','이터널','퀘이사','로맨틱','얼티밋','엠페럴','레전더리','어메이징','인피니트','프리미엄','원더풀','앱솔루트','엘레강스','익스트림','임페리얼','판타스틱','안드로메다','엑설런트','스펙타큘러'];
const TIERS=[
 {name:'일반',ink:'#6f6a7a',ui:'#cfc9dc',max:4,words:[]},
 {name:'고급',ink:'#2f8a3a',ui:'#86e08f',max:7,words:[]},
 {name:'희귀',ink:'#2a62c9',ui:'#86b6ff',max:9,words:[]},
 {name:'영웅',ink:'#8a3cc9',ui:'#cf9fff',max:10,words:[]},
 {name:'전설',ink:'#d9620a',ui:'#ffb05a',max:99,words:[]}];
const TIER_OF={};
for(const w of [...ALL_PREFIXES].sort((a,b)=>jamo(a).length-jamo(b).length)){const n=jamo(w).length,i=TIERS.findIndex(t=>n<=t.max);TIER_OF[w]=i;TIERS[i].words.push(w);}
TIERS.forEach((t,i)=>{const ls=t.words.map(w=>jamo(w).length);t.range=Math.min(...ls)===Math.max(...ls)?Math.min(...ls)+'타':Math.min(...ls)+'~'+Math.max(...ls)+'타';});
const PREFIXES=TIERS.flatMap(t=>t.words);
const WORDS=[...PREFIXES,'파이어볼','홀리','쉴드','홀리쉴드','리플렉트'];
function prefixSum(words,key){const seen={};let s=0;for(const w of words){const k=seen[w]=(seen[w]||0)+1;s+=S[key+TIER_OF[w]]*Math.pow(S.repeatMul/100,k-1);}return s;}
function tierMismatch(a,b){const ca={},cb={};a.forEach(w=>ca[TIER_OF[w]]=(ca[TIER_OF[w]]||0)+1);b.forEach(w=>cb[TIER_OF[w]]=(cb[TIER_OF[w]]||0)+1);let inter=0;for(const k in ca)inter+=Math.min(ca[k],cb[k]||0);return Math.max(a.length,b.length)-inter;}
function sameWords(a,b){return a.length===b.length&&[...a].sort().join()===[...b].sort().join();}
const WJ=WORDS.map(jamo);
function validLen(tok){const j=jamo(tok);let best=0;for(const w of WJ){let k=0;while(k<j.length&&k<w.length&&j[k]===w[k])k++;if(k>best)best=k;}return best;}
function tokens(text){return text.split(/\s+/).filter(Boolean);}
function invalidCount(text){let n=0;for(const t of tokens(text))n+=jamo(t).length-validLen(t);return n;}
function countPrefixes(text){return tokens(text).filter(t=>PREFIXES.includes(t)).length;}
function parseSpell(text){
  const t=tokens(text);if(!t.length)return null;
  const last=t[t.length-1];let kind=null,pre;
  if(last==='파이어볼'){kind='fire';pre=t.slice(0,-1);}
  else if(last==='리플렉트'){kind='reflect';pre=t.slice(0,-1);}
  else if(last==='홀리쉴드'){kind='shield';pre=t.slice(0,-1);}
  else if(last==='쉴드'&&t[t.length-2]==='홀리'){kind='shield';pre=t.slice(0,-2);}
  else return {kind:null};
  if(!pre.every(p=>PREFIXES.includes(p)))return {kind:null};
  return {kind,n:pre.length,pre};
}

let mode='lobby',G=null,now=0;
const typer=document.getElementById('typer'),tf=document.getElementById('tf'),exitBtn=document.getElementById('exit');
function mkC(side){return {side,foot:side?379:40,front:side?357:62,dir:side?-1:1,hp:S.hp,text:'',typos:0,startT:0,lastInv:0,shield:null,reflect:null,flash:0,shake:0,dead:0,typingEndT:0,done:{},pops:{}};}
function newBattle(){
  G={P:mkC(0),E:mkC(1),fbs:[],parts:[],floats:[],over:false,overT:0,banner:1.1};

/* ---------- 입력 ---------- */
let composing=false,lastSubmit=0,clearT=-1e9,clearTail='';
function syncInput(){
  if(mode!=='battle'||!G||G.over||G.P.dead){typer.value='';return;}
  if(performance.now()-clearT<250&&typer.value!==''&&typer.value===clearTail){typer.value='';return;}
  const P=G.P,v=typer.value;
  if(P.text.trim()===''&&v.trim()!==''){P.startT=now;P.typos=0;P.lastInv=0;}
  const inv=invalidCount(v);
  if(inv>P.lastInv)P.typos+=inv-P.lastInv;
  P.lastInv=inv;P.text=v;
}
function clearInput(){
  clearTail=[...typer.value].slice(-1).join('');clearT=performance.now();
  typer.value='';
  if(G){G.P.text='';G.P.lastInv=0;}
}
typer.addEventListener('compositionstart',()=>{composing=true;});
typer.addEventListener('compositionend',()=>{composing=false;setTimeout(syncInput,0);});
typer.addEventListener('input',syncInput);
typer.addEventListener('paste',e=>e.preventDefault());
typer.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.keyCode===13){e.preventDefault();doSubmit();}
});
tf.addEventListener('submit',e=>{e.preventDefault();doSubmit();});
function doSubmit(){
  const t=performance.now();if(t-lastSubmit<150)return;
  if(mode!=='battle'||!G||G.over)return;
  syncInput();
  const P=G.P;if(P.text.trim()===''){return;}
  lastSubmit=t;
  const ks=jamo(P.text.trim()).length,el=Math.max(0.15,now-P.startT);
  castFrom(P,P.text,P.typos,ks/(el/60));
  clearInput();P.typos=0;
}
document.addEventListener('keydown',e=>{if(mode==='battle'&&document.activeElement!==typer&&!e.ctrlKey&&!e.metaKey&&e.key.length===1)typer.focus();});

/* ---------- 주문 처리 ---------- */
const DIST=295;
function rnd(a,b){return a+Math.random()*(b-a);}
function rint(a,b){return Math.floor(rnd(a,b+1));}
function float(x,y,text,col,big){G.floats.push({x,y,text,col,t:0,life:1.2,big:!!big});}
function puff(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(sp*0.3,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.25,.6),t:0,col});}}
function radiusOf(p){return Math.min(14,2.5+Math.sqrt(Math.max(0,p))*0.9);}
function castFrom(c,text,typos,cpm){
  const r=parseSpell(text),hy=FLOOR-82;
  if(!r||!r.kind){float(c.foot,hy,'불발','#cfc6e0');puff(c.front,LANE,'#8c86a0',10,30);return;}
  if(r.kind==='fire'){
    const pen=Math.min(S.typoPen*typos,S.typoMax)/100;
    let power=(S.dmgBase+prefixSum(r.pre,'d'))*(1-pen);
    const crit=typos===0&&Math.random()*100<S.critChance;
    if(crit)power*=S.critMult;
    const T=Math.min(S.crossMax,Math.max(S.crossMin,S.baseCross*S.refCPM/Math.max(1,cpm)));
    G.fbs.push({owner:c.side,x:c.front,dir:c.dir,speed:DIST/T,power,n:r.n,words:r.pre.slice(),crit,alive:true,age:0});
    puff(c.front,LANE,'#ffb030',8,25);
  }else if(r.kind==='shield'){
    const red=Math.min(S.shieldBase+prefixSum(r.pre,'s'),S.shieldMax);
    c.shield={until:now+S.shieldDur,red,dur:S.shieldDur};c.reflect=null;
    float(c.foot,hy,'홀리 쉴드 '+Math.round(red)+'%','#ffe08a');
  }else{
    c.reflect={until:now+S.reflectDur,n:r.n,words:r.pre.slice(),dur:S.reflectDur};c.shield=null;
    float(c.foot,hy,'리플렉트 ×'+r.n,'#d6b8ff');
  }
}
function interrupt(c){
  if(c.side===0){if(c.text.trim()!==''){clearInput();return true;}return false;}
  const ai=c.ai;if(c.text!==''||ai.state==='typing'||ai.state==='hold'){c.text='';ai.ops=[];ai.state='wait';ai.wait=0.7;return true;}return false;
}
function arrive(fb,t){
  const hy=FLOOR-82;
  if(t.reflect&&now<t.reflect.until){
    const exact=sameWords(t.reflect.words,fb.words),d=tierMismatch(t.reflect.words,fb.words);
    const ch=exact?S.refExact:d===0?S.refSame:d===1?S.ref1:d===2?S.ref2:S.ref3;
    if(Math.random()*100<ch){fb.dir*=-1;fb.owner=t.side;fb.x=t.front;fb.age=0;float(t.foot,hy,exact?'완벽한 반사!':'반사!','#d6b8ff',true);puff(t.front,LANE,'#d6b8ff',14,40);return;}
    float(t.foot,hy-9,'반사 실패','#b9a7d6');
  }
  let dmg=fb.power,label='';
  if(t.shield&&now<t.shield.until){dmg*=1-t.shield.red/100;label='방어 ';}
  fb.alive=false;
  dmg=Math.round(dmg*10)/10;
  t.hp=Math.max(0,t.hp-dmg);
  t.flash=0.14;t.shake=0.3;
  puff(t.front,LANE,'#ff8a1f',16,45);
  const shown=Math.round(dmg);
  if(fb.crit)float(t.foot,hy+10,'치명타! '+label+'-'+shown,'#ffd23f',true);
  else float(t.foot,hy+10,label+'-'+shown,label?'#ffe08a':'#ff6b6b',true);
  if(dmg>0&&interrupt(t))float(t.foot,hy,'영창 끊김!','#ffffff');
  if(t.hp<=0&&!G.over){G.over=true;G.overT=0;t.dead=0.0001;typer.blur();
    for(const f of G.fbs)if(f.alive){f.alive=false;puff(f.x,LANE,'#ffd27a',10,30);}
    G.P.shield=G.P.reflect=G.E.shield=G.E.reflect=null;}
}

/* ---------- AI ---------- */
const NEAR=['파','퍼','슈','울','엘','리','쉴','홀','이','어','볼','라','레','스','트','렉','플','드','엠','페','럴','강'];
function prefixStr(n){let s='';for(let i=0;i<n;i++)s+=PREFIXES[rint(0,PREFIXES.length-1)]+' ';return s;}
function copyWords(words){
  if(Math.random()<0.5)return words.map(w=>w+' ').join('');
  return words.map(w=>{const t=TIERS[TIER_OF[w]].words;return t[rint(0,t.length-1)]+' ';}).join('');
}
function buildOps(text){const iv=60/Math.max(30,S.aiCPM),ops=[];for(const ch of text){if(ch!==' '&&Math.random()*100<S.aiTypo){const w=NEAR[rint(0,NEAR.length-1)];ops.push({d:jamo(w).length*iv,add:w,typo:true});ops.push({d:0.25+iv,del:true});}ops.push({d:(ch===' '?1:jamo(ch).length)*iv,add:ch});}return ops;}
function aiStart(text,kind,hold){const E=G.E,ai=E.ai;ai.ops=buildOps(text);ai.opT=0;ai.state='typing';ai.hold=hold;ai.kind=kind;ai.holdT=0;E.text='';E.typos=0;E.startT=now;}
function incoming(c){let best=null;for(const f of G.fbs){if(!f.alive||f.owner===c.side)continue;const eta=Math.abs(c.front-f.x)/f.speed;if(!best||eta<best.eta)best={eta,fb:f};}return best;}
function aiDecide(){
  const P=G.P,E=G.E,ptxt=P.text.trim(),pPre=countPrefixes(ptxt);
  const attacking=ptxt!==''&&!/리|홀|쉴/.test(ptxt);
  if(attacking&&pPre>=2&&Math.random()*100<S.aiInterrupt)return aiStart('파이어볼','fire',false);
  const inc=incoming(E);
  if(inc&&Math.random()*100<S.aiDefend){
    const txt=Math.random()<0.5?copyWords(inc.fb.words)+'리플렉트':prefixStr(rint(1,2))+'홀리 쉴드';
    const need=jamo(txt).length*60/Math.max(30,S.aiCPM);
    if(need<inc.eta-0.2)return aiStart(txt,txt.endsWith('리플렉트')?'reflect':'shield',true);
  }
  if(attacking&&Math.random()*100<S.aiDefend){
    if(Math.random()<0.5)return aiStart(copyWords(tokens(ptxt).filter(t=>PREFIXES.includes(t)))+'리플렉트','reflect',true);
    return aiStart(prefixStr(rint(1,2))+'홀리 쉴드','shield',true);
  }
  aiStart(prefixStr(rint(0,Math.max(0,Math.floor(S.aiMaxPrefix))))+'파이어볼','fire',false);
}
function aiUpdate(dt){
  const E=G.E,ai=E.ai;if(G.over)return;
  if(ai.state==='wait'){ai.wait-=dt;if(ai.wait<=0)aiDecide();return;}
  if(ai.state==='typing'){
    ai.opT+=dt;
    while(ai.ops.length&&ai.opT>=ai.ops[0].d){const op=ai.ops.shift();ai.opT-=op.d;if(op.add){E.text+=op.add;if(op.typo)E.typos++;}if(op.del)E.text=[...E.text].slice(0,-1).join('');}
    if(!ai.ops.length){E.typingEndT=now;ai.state=ai.hold?'hold':'fire';ai.holdT=0;}
  }
  if(ai.state==='hold'){
    ai.holdT+=dt;const inc=incoming(E),win=ai.kind==='reflect'?S.reflectDur:S.shieldDur;
    if(inc&&inc.eta<=win*0.5)ai.state='fire';
    else if(ai.holdT>5){E.text='';ai.state='wait';ai.wait=0.4;}
  }
  if(ai.state==='fire'){
    const ks=jamo(E.text.trim()).length,el=Math.max(0.15,E.typingEndT-E.startT);
    castFrom(E,E.text,E.typos,ks/(el/60));E.text='';E.typos=0;ai.state='wait';ai.wait=rnd(0.8,1.8);
  }
}

/* ---------- 갱신 ---------- */
function update(dt){
  if(mode!=='battle'||!G)return;
  G.banner=Math.max(0,G.banner-dt);
  aiUpdate(dt);
  for(const c of [G.P,G.E]){for(const k in c.pops){c.pops[k]-=dt;if(c.pops[k]<=0)delete c.pops[k];}c.flash=Math.max(0,c.flash-dt);c.shake=Math.max(0,c.shake-dt);if(c.dead)c.dead+=dt;if(c.shield&&now>=c.shield.until)c.shield=null;if(c.reflect&&now>=c.reflect.until)c.reflect=null;}
  for(const f of G.fbs){if(!f.alive)continue;f.x+=f.dir*f.speed*dt;f.age+=dt;
    if(Math.random()<0.9)G.parts.push({x:f.x-f.dir*radiusOf(f.power)*0.6,y:LANE+rnd(-2,2),vx:-f.dir*rnd(5,20),vy:rnd(-6,6),life:rnd(.2,.4),t:0,col:Math.random()<.5?'#ff8a1f':'#a8321a'});}
  const fw=G.fbs.filter(f=>f.alive&&f.dir>0),bw=G.fbs.filter(f=>f.alive&&f.dir<0);
  for(const a of fw)for(const b of bw){
    if(!a.alive||!b.alive)continue;
    if(b.x-a.x<=radiusOf(a.power)+radiusOf(b.power)&&b.x-a.x>-20){
      const mx=(a.x+b.x)/2;puff(mx,LANE,'#ffd27a',22,55);
      if(Math.abs(a.power-b.power)<0.01){a.alive=b.alive=false;float(mx,LANE-14,'상쇄','#ffe9b0');}
      else{const w=a.power>b.power?a:b,l=w===a?b:a;w.power-=l.power;l.alive=false;w.crit=false;float(mx,LANE-14,'상쇄','#ffe9b0');}
    }
  }
  for(const f of G.fbs){if(!f.alive||G.over)continue;if(f.dir>0&&f.x>=G.E.front)arrive(f,G.E);else if(f.dir<0&&f.x<=G.P.front)arrive(f,G.P);}
  G.fbs=G.fbs.filter(f=>f.alive);
  for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  G.parts=G.parts.filter(p=>p.t<p.life);
  for(const f of G.floats)f.t+=dt;
  G.floats=G.floats.filter(f=>f.t<f.life);
  if(G.over){G.overT+=dt;if(G.overT>1.3&&!resultShown)showResult();}
}

/* ---------- 그리기 ---------- */
function px(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}
function disc(cx,cy,r,col){ctx.fillStyle=col;const R=Math.round(r);for(let dy=-R;dy<=R;dy++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy)));ctx.fillRect(Math.round(cx)-w,Math.round(cy)+dy,w*2+1,1);}}
function text(t,x,y,size,col,align,bold,stroke){
  ctx.font=size+'px '+(bold?'Galmuri11B':'Galmuri11');ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  if(stroke){ctx.fillStyle=stroke;const o=size/9;for(const[dx,dy]of[[o,0],[-o,0],[0,o],[0,-o],[o,o],[-o,-o],[o,-o],[-o,o]])ctx.fillText(t,x+dx,y+dy);}
  ctx.fillStyle=col;ctx.fillText(t,x,y);
}
function drawChar(c,idle,read,wIdle,wRead){
  const reading=c.text.trim()!==''||(c.side===1&&c.ai&&(c.ai.state==='typing'||c.ai.state==='hold'));
  const img=reading?read:idle,wimg=reading?wRead:wIdle;
  let x=Math.round(c.foot-img.width/2),y=FLOOR-img.height;
  if(c.shake>0)x+=Math.round(Math.sin(c.shake*60)*1.5);
  if(c.dead){const k=Math.min(1,c.dead/1.1);ctx.globalAlpha=1-k;y+=Math.round(k*10);}
  ctx.drawImage(img,x,y);
  if(c.flash>0){ctx.globalAlpha=Math.min(1,c.flash/0.14)*0.85;ctx.drawImage(wimg,x,y);}
  ctx.globalAlpha=1;
}
function drawShield(c){
  if(!c.shield)return;const left=(c.shield.until-now)/c.shield.dur,cx=c.foot,cy=FLOOR-36;
  ctx.globalAlpha=Math.min(1,left*3)*(0.75+0.25*Math.sin(now*30));
  for(let a=-70;a<=70;a+=4){const r=a*Math.PI/180,x=cx+c.dir*Math.cos(r)*26,y=cy+Math.sin(r)*40;px(Math.round(x),Math.round(y),2,2,(a/4)%2?'#ffe08a':'#fff6cf');}
  ctx.globalAlpha=1;
}
function drawReflect(c){
  if(!c.reflect)return;const left=(c.reflect.until-now)/c.reflect.dur,x=c.front+c.dir*6;
  ctx.globalAlpha=Math.min(1,left*3);
  for(let y=FLOOR-74;y<=FLOOR-34;y+=2)px(x,y,2,1,(Math.floor(y/2+now*20)%3)?'#c79bff':'#ffffff');
  px(x-c.dir*3,FLOOR-76,2,2,'#efe0ff');px(x-c.dir*3,FLOOR-34,2,2,'#efe0ff');
  ctx.globalAlpha=1;
}
function drawFire(f){
  const r=radiusOf(f.power),fl=Math.sin(f.age*40)*0.6;
  disc(f.x,LANE,r+fl,f.crit?'#ff3b6b':'#ff5a1f');disc(f.x,LANE,r*0.66,'#ffb030');disc(f.x,LANE,Math.max(1,r*0.33),f.crit?'#ffffff':'#fff3b0');
}
function layoutPage(str,w,ink){
  const lines=[[]];let x=0,ti=0;const seen={};
  for(const seg of str.split(/(\s+)/)){
    if(seg==='')continue;
    if(/^\s+$/.test(seg)){ctx.font=TX.fs+'px Galmuri11';const sw=ctx.measureText(' ').width*seg.length;if(x>0){lines[lines.length-1].push({ws:true,x,w:sw});x+=sw;}continue;}
    const tier=TIER_OF[seg];let st;
    if(tier!==undefined){const k=seen[seg]=(seen[seg]||0)+1;st={col:TIERS[tier].ink,bold:true,alpha:k>1?Math.max(0.4,Math.pow(S.repeatMul/100,k-1)):1,tier,key:ti+':'+seg};}
    else if(validLen(seg)<jamo(seg).length)st={col:'#c0303a'};
    else st={col:ink};
    ctx.font=TX.fs+'px '+(st.bold?'Galmuri11B':'Galmuri11');
    let sw=ctx.measureText(seg).width;
    const pieces=[];
    if(sw>w){let part='';for(const ch of seg){if(ctx.measureText(part+ch).width>w){pieces.push(part);part='';}part+=ch;}pieces.push(part);}else pieces.push(seg);
    pieces.forEach((pc,pi)=>{
      const pw=ctx.measureText(pc).width;
      if(x>0&&x+pw>w){const L=lines[lines.length-1];while(L.length&&L[L.length-1].ws)L.pop();lines.push([]);x=0;}
      lines[lines.length-1].push(Object.assign({t:pc,x,w:pw},st,pi?{key:undefined}:{}));x+=pw;
    });
    ti++;
  }
  return lines;
}
function drawPage(c,pg,label,str,ink,stat,showCursor,hint){
  text(label,pg.x,TX.label,TX.small,'#9a87b8');
  if(str===''&&hint)text(hint,pg.x,TX.top,TX.small*1.1,'#b5a8c9');
  let lines=layoutPage(str,pg.w,ink);
  const live={};for(const ln of lines)for(const s of ln)if(s.key)live[s.key]=1;
  if(lines.length>TX.lines)lines=lines.slice(lines.length-TX.lines);
  lines.forEach((ln,i)=>{
    const y=TX.top+i*TX.lh;
    for(const s of ln){
      if(s.ws)continue;
      const cx=pg.x+s.x+s.w/2;
      if(s.key){if(!c.done[s.key]){c.done[s.key]=1;c.pops[s.key]=0.35;bookBurst(cx,y-3,s.tier);}}
      const pop=s.key&&c.pops[s.key]?c.pops[s.key]:0;
      ctx.globalAlpha=s.alpha||1;
      if(pop>0){text(s.t,cx,y+pop*3,TX.fs*(1+pop*(0.6+s.tier*0.15)),s.col,'center',true,'#ffffff');}
      else text(s.t,pg.x+s.x,y,TX.fs,s.col,'left',!!s.bold);
      ctx.globalAlpha=1;
    }
    if(showCursor&&i===lines.length-1&&Math.floor(now*2.5)%2===0){const l=ln[ln.length-1];px(Math.round(pg.x+(l?l.x+l.w:0))+1,y-TX.fs*0.85,Math.max(1,TX.fs/7),TX.fs,ink);}
  });
  for(const k in c.done)if(!live[k]){delete c.done[k];delete c.pops[k];}
  if(stat)text(stat,pg.x,TX.stat,TX.small,'#8a7aa8');
}
function bookBurst(x,y,tier){
  const col=TIERS[tier].ink,n=6+tier*5,sp=14+tier*7;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(sp*0.4,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,life:rnd(.3,.5+tier*0.1),t:0,col:i%3===0?'#ffffff':col});}
  if(tier>=3)for(let i=0;i<10+tier*3;i++){const a=i/(10+tier*3)*Math.PI*2;G.parts.push({x,y,vx:Math.cos(a)*sp*1.3,vy:Math.sin(a)*sp*0.7,life:0.45,t:0,col:tier===4?'#ffd23f':'#e6c8ff'});}
}
function hpBar(c,x,name,col,right){
  const w=150,h=5,y=10,k=c.hp/S.hp;
  text(name,right?x+w:x,7.5,6,'#ffffff',right?'right':'left',true,'#1b1236');
  text(Math.ceil(c.hp)+'',right?x:x+w,7.5,6,'#ffffff',right?'left':'right',false,'#1b1236');
  px(x-1,y-1,w+2,h+2,'#1b1236');px(x,y,w,h,'#3a2f55');
  const fw=Math.round(w*k);px(right?x+w-fw:x,y,fw,h,col);px(right?x+w-fw:x,y,fw,1,'#ffffff55');
}
function draw(){
  ctx.setTransform(SC,0,0,SC,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';ctx.fillRect(0,0,LW,LH);
  if(mode!=='battle'||!G){const lh=IMG.bg_lobby.height*LW/IMG.bg_lobby.width;ctx.drawImage(IMG.bg_lobby,0,Math.round((LH-lh)/2),LW,lh);return;}
  ctx.drawImage(IMG.bg_ingame,0,TOP,LW,FIELD_H);
  const P=G.P,E=G.E;
  drawChar(P,IMG.red_idle,IMG.red_read,WHITE.red_idle,WHITE.red_read);
  drawChar(E,IMG.blue_idle,IMG.blue_read,WHITE.blue_idle,WHITE.blue_read);
  drawShield(P);drawShield(E);drawReflect(P);drawReflect(E);
  drawBook(BK);
  const focused=document.activeElement===typer;
  drawPage(P,PL,'나의 주문',P.text,'#3b2a5c','접두어 '+countPrefixes(P.text)+' · 오타 '+P.typos,focused&&!G.over,focused?'':'눌러서 주문 입력');
  const ai=E.ai;
  drawPage(E,PR,'적의 영창',E.text,'#24406e',E.text?'접두어 '+countPrefixes(E.text):'',ai.state==='typing',null);
  for(const f of G.fbs)drawFire(f);
  for(const p of G.parts){ctx.globalAlpha=1-p.t/p.life;px(Math.round(p.x),Math.round(p.y),1,1,p.col);}
  ctx.globalAlpha=1;
  for(const f of G.floats){const k=f.t/f.life;ctx.globalAlpha=k>0.7?(1-k)/0.3:1;text(f.text,f.x,f.y-k*12,f.big?8:6.5,f.col,'center',true,'#1b1236');}
  ctx.globalAlpha=1;
  hpBar(P,8,'플레이어','#e0405a',false);hpBar(E,LW-158,'파란 마법사','#4a7ce0',true);
  if(G.banner>0){ctx.globalAlpha=Math.min(1,G.banner*3);text('시작!',LW/2,62,16,'#ffe08a','center',true,'#1b1236');ctx.globalAlpha=1;}
}

/* ---------- 화면 전환 ---------- */
const $=id=>document.getElementById(id);
let resultShown=false;
function show(id,on){$(id).classList.toggle('on',on);}
function startBattle(){
  newBattle();mode='battle';resultShown=false;
  show('lobby',false);show('result',false);
  tf.style.display='block';exitBtn.style.display='block';
  typer.focus();
}
function toLobby(){mode='lobby';G=null;tf.style.display='none';exitBtn.style.display='none';typer.blur();show('result',false);show('lobby',true);}
function showResult(){
  resultShown=true;const win=G.E.hp<=0;
  $('rtitle').textContent=win?'승리!':'패배…';$('rtitle').style.color=win?'#ffe08a':'#b9a7d6';
  $('rsub').textContent='남은 체력 '+Math.ceil(G.P.hp)+' : '+Math.ceil(G.E.hp);
  show('result',true);
}
$('bStart').onclick=startBattle;$('bAgain').onclick=startBattle;$('bLobby').onclick=toLobby;exitBtn.onclick=toLobby;
$('bHelp').onclick=()=>{fillHelp();show('help',true);};
$('bList').onclick=()=>{fillList();show('list',true);};
$('gear').onclick=()=>{fillSettings();show('settings',true);};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{show('help',false);show('list',false);show('settings',false);});
$('bReset').onclick=()=>{S=Object.assign({},DEF);saveS();fillSettings();};
function fillHelp(){
  $('helpBody').innerHTML=`
<h3>주문 쓰기</h3><ul>
<li>전투 중에는 키보드로 그냥 치면 돼요. 휴대폰은 화면을 누르면 키보드가 떠요.</li>
<li>주문은 <b>접두어 + 주문 이름</b>이고 띄어쓰기로 구분해요. <span class="ex">예) 울트라 슈퍼 파이어볼</span></li>
<li>엔터를 누르면 발사돼요. 형식이 틀리면 불발이에요.</li>
<li>치는 동안 마법사가 책을 펼쳐 읽어요. 책 왼쪽 장에 내 주문, 오른쪽 장에 적의 영창이 적혀요.</li></ul>
<h3>세기와 속도</h3><ul>
<li>접두어를 많이 붙일수록 강해요. 개수 제한은 없어요.</li>
<li>타수(자모 수)가 많은 접두어일수록 등급이 높고 더 강해요. 다 치면 책 속 단어가 등급 색으로 빛나요.</li>
<li>같은 접두어를 반복하면 할 때마다 효과가 ${S.repeatMul}%로 줄어요.</li>
<li>빨리 칠수록 파이어볼이 빨리 날아가요.</li>
<li>틀린 글자를 칠 때마다 데미지가 ${S.typoPen}%씩 줄어요(최대 ${S.typoMax}%). 고쳐도 기록돼요.</li>
<li>오타 없이 치면 ${S.critChance}% 확률로 치명타(${S.critMult}배)가 터져요.</li>
<li>치는 도중에 맞으면 영창이 끊기고 쓰던 글자가 사라져요.</li></ul>
<h3>방어</h3><ul>
<li><b>홀리 쉴드</b>: 엔터 후 ${S.shieldDur}초 동안 피해를 ${S.shieldBase}% 줄여요. 접두어 등급이 높을수록 더 많이 줄어요(최대 ${S.shieldMax}%).</li>
<li><b>리플렉트</b>: 엔터 후 ${S.reflectDur}초 동안 유지돼요. 날아오는 주문과 접두어가 똑같으면 ${S.refExact}%, 등급 구성만 같으면 ${S.refSame}% 확률로 되돌려 보내요. 등급이 한 칸 다르면 ${S.ref1}%, 두 칸 다르면 ${S.ref2}%로 떨어지고, 실패하면 그대로 맞아요.</li>
<li>오른쪽 장에서 적이 쓰는 접두어를 보고 리플렉트를 준비하세요.</li></ul>
<h3>공중 충돌</h3><ul><li>파이어볼끼리 부딪히면 센 쪽이 이기고, 위력 차이만큼 남아서 계속 날아가요. 같으면 둘 다 사라져요.</li></ul>`;
}
function fillList(){
  const tiers=TIERS.map((t,i)=>`<p><b style="color:${t.ui}">${t.name}</b> <span style="color:#a89cc4">${t.range} · (데미지 +${S['d'+i]} · 쉴드 +${S['s'+i]}%)</span><br><span style="color:${t.ui}">${t.words.join(' · ')}</span></p>`).join('');
  $('listBody').innerHTML=`
<h3>접두어</h3><p>몇 개든 붙일 수 있어요. 같은 접두어를 반복하면 할 때마다 ${S.repeatMul}%로 약해져요.</p>${tiers}
<h3>공격</h3><p><b>파이어볼</b> — 기본 데미지 ${S.dmgBase}</p><p class="ex">파이어볼 · 메가 파이어볼 · 스펙타큘러 임페리얼 파이어볼</p>
<h3>방어</h3><p><b>홀리 쉴드</b> — 기본 피해 ${S.shieldBase}% 감소 + 접두어 등급만큼</p><p class="ex">홀리 쉴드 · 안드로메다 홀리 쉴드</p>
<h3>반사</h3><p><b>리플렉트</b> — 접두어가 똑같으면 ${S.refExact}%, 등급 구성이 같으면 ${S.refSame}%</p><p class="ex">적이 '원더풀 메가 파이어볼'을 쏘면 → '원더풀 메가 리플렉트'(${S.refExact}%) 또는 '프리미엄 킹 리플렉트'(${S.refSame}%)</p>`;
}
function fillSettings(){
  const b=$('setBody');b.innerHTML='';
  for(const[g,items]of LABELS){const h=document.createElement('h3');h.textContent=g;b.appendChild(h);
    for(const[k,l]of items){const r=document.createElement('label');r.className='row';r.innerHTML='<span></span><input type="number" step="any">';r.firstChild.textContent=l;const inp=r.lastChild;inp.value=S[k];
      inp.onchange=()=>{const v=parseFloat(inp.value);if(isFinite(v)){S[k]=v;saveS();}else inp.value=S[k];};b.appendChild(r);}}
}

/* ---------- 루프 ---------- */
let last=0;
function loop(t){const dt=Math.min(0.05,(t-last)/1000||0);last=t;now+=dt;update(dt);draw();requestAnimationFrame(loop);}
(async()=>{
  for(const k in SRC)IMG[k]=await loadImg(SRC[k]);
  for(const k of ['red_idle','red_read','blue_idle','blue_read'])WHITE[k]=whiteOf(IMG[k]);
  try{await Promise.all([document.fonts.load('10px Galmuri11','가'),document.fonts.load('10px Galmuri11B','가')]);}catch(e){}
  resize();requestAnimationFrame(t=>{last=t;loop(t);});
})();

window.__incant={get G(){return G},get S(){return S},jamo,parseSpell,invalidCount,startBattle};
</script>
